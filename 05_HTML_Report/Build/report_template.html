<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eBay Final Output Sales</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--surface-2:#f7f8fa;--border:#e1e5ea;--line:#eceff3;--text:#1f2933;--muted:#5f6b7a;--head:#3a4452;
  --accent:#1f5fa8;--accent-soft:#eef3fa;--pos:#15803d;--pos-soft:#e9f7ee;--pos-line:#9fd8b0;
  --neg:#c0392b;--neg-soft:#fdeeee;--neg-line:#f2b8b1;--warn:#c2680a;--warn-soft:#fff4e6;--warn-line:#f7c99a;
  --blue:#2563eb;--blue-soft:#eaf1fe;--blue-line:#b3cbf7;--na:#8b95a3;--std:#2f6db5;--adv:#7a4fb0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{padding:18px 24px 32px}
h1{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 14px}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);gap:4px}
.qwrap{position:relative;display:inline-flex}
.filters input[type=search]{font:inherit;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;padding:6px 28px 6px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);min-width:300px}
.filters input[type=search]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.filters input[type=search]::-webkit-search-cancel-button{display:none}
#fQx{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--na);font-size:16px;cursor:pointer;padding:0 4px;display:none}
.filters select{font:inherit;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);min-width:230px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 12px 10px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:2px 4px 10px}
.card-head h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--head)}
.showing{font-size:12.5px;color:var(--muted)}.showing b{color:var(--text)}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 260px);min-height:320px;border:1px solid var(--line);border-radius:6px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:12px 10px;text-align:right;white-space:nowrap;vertical-align:middle;border-bottom:1px solid var(--line);background:var(--surface)}
thead th{position:sticky;top:0;z-index:2;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--head);
  border-bottom:2px solid var(--border);padding:11px 10px;white-space:nowrap}
.t{text-align:left}
tbody tr[data-id]:hover td{background:#fafbfc}
tbody tr[data-id] td:first-child{box-shadow:inset 3px 0 0 var(--bar,#cbd2da)}
tr.sA{--bar:#22a55a}tr.sBad{--bar:#e5534b}tr.sU{--bar:#f08c2e}tr.sN{--bar:#cbd2da}
.ph{display:block;margin-top:3px;font-size:10.5px;color:var(--muted);white-space:normal;max-width:170px}
.eid{font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;font-size:12px;border-bottom:1px dotted #8a94a3;color:var(--text)}
tr.grp td{background:var(--accent-soft);color:var(--accent);text-align:left;font-weight:700;font-size:12px;letter-spacing:.02em;padding:9px 12px;border-bottom:1px solid #d9e3f2}
tr.grp .tot{font-weight:500;color:var(--muted);margin-left:14px}
tr.grp .tot b{color:var(--text);font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.na{color:var(--na);font-style:italic}
.s{display:block;line-height:1.45}
.s b{font-weight:600;font-size:9.5px;margin-right:5px;padding:0 4px;border-radius:4px;font-style:normal}
.s b.std{background:#e8f0fa;color:var(--std)}.s b.adv{background:#f1eafa;color:var(--adv)}
.sku{min-width:200px;max-width:230px}
.sku .skus{max-height:112px;overflow-y:auto;padding-right:4px}
.sku .one{display:block;white-space:normal;overflow-wrap:break-word;line-height:1.4;padding:1px 0}
.sku .cnt{display:inline-block;font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:0 6px;margin-top:3px}
.more{display:inline-block;font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:0 6px;margin-left:4px;cursor:help;font-style:normal}
.src{display:inline-block;font-size:10.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:0 6px;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;margin:2px 3px 2px 0;border:1px solid}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--pos-soft);color:var(--pos);border-color:var(--pos-line)}
.pill.bad{background:var(--neg-soft);color:var(--neg);border-color:var(--neg-line)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.grey{background:var(--surface-2);color:var(--muted);border-color:var(--border)}
td.seg{text-align:left;white-space:normal;min-width:180px}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.pager .nav{display:flex;gap:8px;align-items:center}
.pager button{font:inherit;font-size:12.5px;font-weight:600;color:var(--text);padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.pager select{font:inherit;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;margin-left:8px}
.foot{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.6}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 14px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover:not(.on){color:var(--text)}
.filters input.pq{min-width:200px;padding-right:10px}
.btn{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;align-self:flex-end}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:-4px 0 12px;line-height:1.55}
/* Price & SKU Sales Analysis: same table styling as Final Output Sales (global table/th/td/thead rules above);
   only the frozen eBay ID column, the ID-group separator and column widths are specific to this table */
#pt{min-width:980px}
#pWrap{border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
#pt thead th{background:linear-gradient(#f7f9fc,#eef2f7);color:var(--head);border-bottom:2px solid #d6dde7}
#pt thead th:first-child{position:sticky;left:0;z-index:4;text-align:center;box-shadow:inset -1px 0 0 #d6dde7;width:180px;min-width:180px;max-width:180px}
/* frozen columns: eBay ID (0-180px) and SKU (from 180px) stay visible when scrolling sideways */
#pt thead th:nth-child(2){position:sticky;left:180px;z-index:4;box-shadow:inset -2px 0 0 #d6dde7}
#pt td.psku{position:sticky;left:180px;z-index:1;box-shadow:inset -2px 0 0 #d6dde7}
/* eBay ID: one merged box per ID group, ID centred, frozen on the left */
#pt td.idbox{position:sticky;left:0;z-index:2;text-align:center;vertical-align:middle;width:180px;min-width:180px;max-width:180px;
  border-right:1px solid #d6dde7;border-bottom:1px solid #d6dde7}
#pt td.idbox .eid{display:block;font-size:12.5px;font-weight:600;border-bottom:0;color:var(--accent);letter-spacing:.02em}
#pt td.idbox .acc{display:inline-block;margin-top:6px;padding:1px 8px;border-radius:10px;background:#e3eaf5;color:var(--head);font-size:10.5px}
/* each eBay ID group in its own colour band (4 soft tints in turn) so neighbouring IDs never look alike */
#pt tbody tr.g0 td{background:#f4f8ff}#pt tbody tr.g0 td.idbox{background:#e3edfc;box-shadow:inset 4px 0 0 #3b6fb6}
#pt tbody tr.g1 td{background:#f3faf5}#pt tbody tr.g1 td.idbox{background:#ddf1e3;box-shadow:inset 4px 0 0 #2f8a4f}
#pt tbody tr.g2 td{background:#fff9f0}#pt tbody tr.g2 td.idbox{background:#fcebd2;box-shadow:inset 4px 0 0 #c27a12}
#pt tbody tr.g3 td{background:#f8f5fd}#pt tbody tr.g3 td.idbox{background:#ebe3f8;box-shadow:inset 4px 0 0 #7a4fb0}
#pt tbody tr:hover td:not(.idbox){filter:brightness(.97)}
#pt tbody tr.first td{border-top:2px solid #d6dde7}
#pt tbody tr[data-id] td:not(.idbox){box-shadow:none}
#pt tbody tr[data-id] td.psku{box-shadow:inset -2px 0 0 #d6dde7}
#pt td.num span:not(.cur):not(.was){font-weight:500}
#pt td.cat{color:var(--head)}
#pt th.sortable{cursor:pointer;user-select:none}
#pt th.sortable:hover{color:var(--accent)}
#pt th .arw{font-size:9px;margin-left:3px;color:var(--accent)}
#pt td.t,#pt th.t{text-align:left}
#pt td.num{text-align:right}
#pt td.psku{white-space:normal;overflow-wrap:anywhere;min-width:200px;max-width:300px}
#pt td.cat{white-space:normal;min-width:110px}
#pt .cur{color:var(--muted);margin-right:1px}
#pt .acc{display:block;margin-top:3px;font-size:10.5px;color:var(--muted)}
#pt .was{display:block;font-size:10.5px;color:var(--muted)}
#pt .zero{color:var(--na)}
#pt .pst{display:block;margin-top:3px;font-size:10.5px;font-weight:600;white-space:nowrap}
#pt .pst.inc{color:var(--pos)}#pt .pst.exc{color:var(--warn)}#pt .pst.unk{color:var(--na);font-weight:400;font-style:italic}
/* September Comparison Table: Sep 2026 date range (calendar inputs) */
.drange{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:0 4px 10px}
.drange label{display:flex;flex-direction:column;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);gap:4px}
.drange input[type=date]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text)}
.drange input[type=date]:invalid,.drange input[type=date].bad{border-color:var(--neg);outline:1px solid var(--neg)}
.drange .rmsg{font-size:12px;color:var(--muted);align-self:center}.drange .rmsg.err{color:var(--neg);font-weight:600}
thead th .rh{display:block;font-size:9.5px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--accent);margin-top:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.yes{color:var(--pos);font-weight:600}.no{color:var(--muted)}
@media (max-width:700px){
  main{padding-left:16px;padding-right:16px}
  .filters select{min-width:0;width:100%}
  .filters label{flex:1 1 140px}
}
</style>
</head>
<body>
<main>
  <h1>eBay – Final OutPut Sales</h1>
  <div class="sub" id="sub"></div>
  <nav class="tabs" role="tablist"><button type="button" class="on" id="tabBtnMain" data-tab="main" role="tab">Final Output Sales</button><button type="button" id="tabBtnPrice" data-tab="price" role="tab">Price &amp; SKU Sales Analysis</button></nav>
  <section id="tabMain">
  <div class="filters" role="search">
    <label>PH<select id="fPh"></select></label>
    <label>Category<select id="fCat"></select></label>
    <label>Account<select id="fAcct"></select></label>
    <label>Segment<select id="fSeg"></select></label>
    <label>Search eBay ID / SKU<span class="qwrap"><input type="search" id="fQ" placeholder="Type an eBay ID or SKU…" autocomplete="off"><button type="button" id="fQx" title="Clear search">&times;</button></span></label>
    <button type="button" class="btn primary" id="fDl">Download Excel</button>
  </div>
  <div class="card">
    <div class="card-head"><h2>September Comparison Table</h2><span class="showing" id="count"></span></div>
    <div class="drange" id="dRange">
      <label>Date From<input type="date" id="sdFrom" min="2026-09-01" value="2026-09-01" required></label>
      <label>Date To<input type="date" id="sdTo" min="2026-09-01" required></label>
      <span class="rmsg" id="rMsg"></span>
    </div>
    <div class="tbl-wrap" id="wrap"><table id="t"></table></div>
    <div class="pager">
      <span class="nav"><button id="pgFirst" type="button">&laquo; First</button><button id="pgPrev" type="button">&lsaquo; Prev</button>
        <span id="pgInfo"></span><button id="pgNext" type="button">Next &rsaquo;</button><button id="pgLast" type="button">Last &raquo;</button></span>
      <span>Rows per page<select id="pgSize"><option>25</option><option selected>50</option><option>100</option><option>200</option></select></span>
    </div>
  </div>
  <div class="foot" id="foot"></div>
  </section>
  <section id="tabPrice" hidden>
  <div class="filters" role="search">
    <label>PH<select id="pPh"></select></label>
    <label>Category<select id="pCat"></select></label>
    <label>Price snapshot From<select id="pFrom"></select></label>
    <label>Price snapshot To<select id="pTo"></select></label>
    <label>Search eBay ID<input type="search" class="pq" id="pId" placeholder="eBay ID…" autocomplete="off"></label>
    <label>Search SKU<input type="search" class="pq" id="pSku" placeholder="SKU…" autocomplete="off"></label>
    <button type="button" class="btn primary" id="pDl">Download Excel</button>
    <button type="button" class="btn" id="pClr">Clear Filters</button>
  </div>
  <div class="note" id="pNote"></div>
  <div class="card">
    <div class="card-head"><h2>Price &amp; SKU Sales Analysis</h2><span class="showing" id="pCount"></span></div>
    <div class="drange" id="pRange">
      <label>Date From<input type="date" id="psFrom" min="2026-09-01" value="2026-09-01" required></label>
      <label>Date To<input type="date" id="psTo" min="2026-09-01" required></label>
      <span class="rmsg" id="psMsg"></span>
    </div>
    <div class="tbl-wrap" id="pWrap"><table id="pt"></table></div>
    <div class="pager">
      <span class="nav"><button id="ppFirst" type="button">&laquo; First</button><button id="ppPrev" type="button">&lsaquo; Prev</button>
        <span id="ppInfo"></span><button id="ppNext" type="button">Next &rsaquo;</button><button id="ppLast" type="button">Last &raquo;</button></span>
      <span>Rows per page<select id="ppSize"><option>50</option><option selected>100</option><option>200</option><option>500</option></select></span>
    </div>
  </div>
  <div class="foot" id="pFoot"></div>
  </section>
</main>
<script>
const DATA = /*__DATA__*/null;
(function(){
"use strict";
const ACCTS=["Sunsone","Ledsone","Electricalsone","Huttenlampen","ledsone uk de","ledsone de"];
const COLS=["eBay ID","SKU","LY Sales","TY Sales","YoY %","LY Ad Sales","TY Ad Sales","LY Views","TY Views","LY Orders","TY Orders",
  "LY Conversion %","TY Conversion %","Ad Impressions","Ad Clicks","Ad Spend","Ad Sales","ROAS/ACOS","Segment"];
const KEYS=["id","sku","lys","tys","yoy","LYAdSales","TYAdSales","lyv","tyv","lyo","tyo","lyc","tyc","AdImpressions","AdClicks","AdSpend","AdSales","ra","seg"];
// LY / TY Price moved to the "Price & SKU Sales Analysis" tab as Last Year Price / This Year Price (per SKU)
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=a=>({s:a[0],o:a[1],u:a[2],pxq:a[3],v:a[4],im:a[5]});
const ROWS=DATA.rows.map((a,i)=>({i,acct:a[0],mp:a[1],id:a[2],skus:a[3],LY:P(a[4]),TY:P(a[5]),ads:a[6],seg:a[7],lsku:a[8]||[],created:a[9]||null,ph:a[10]||[]}));
const NOPH="__none__";
// listing created after Sep 2025 and no LY order/traffic/ad row at all -> LY gap cells read "Not live in Sep 2025"
const LY_END="2025-09-30";
for(const r of ROWS){r.nl=!!(r.created&&r.created>LY_END&&r.LY.s===0&&r.LY.o===0&&r.LY.v===null&&!(r.ads.S&&r.ads.S.LY)&&!(r.ads.A&&r.ads.A.LY));}
const fmtD=d=>{const p=d.split("-");return +p[2]+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]+" "+p[0];};
// the latest order date can still be in progress in the source: its New / Hold orders are not Completed yet (never counted)
const OPEN=DATA.days.end_open||{},OPEN_N=Object.values(OPEN).reduce((a,b)=>a+b,0),END_SHORT=fmtD(DATA.days.end_date).replace(/ \d{4}$/,"");
const openTxt=()=>OPEN_N?" · "+fmtD(DATA.days.end_date)+" incomplete in source: "+OPEN_N.toLocaleString("en-GB")+" eBay orders of that day not Completed yet ("+Object.entries(OPEN).map(([k,v])=>v+" "+k).join(", ")+"), not counted":"";
const srcTxt=()=>"Latest data in the source: Completed eBay orders to "+fmtD(DATA.days.end_date)+"; traffic (Views) to "+fmtD(DATA.days.traffic_end)+"; current eBay listing prices synced "+esc(DATA.price.listing_synced_at.slice(0,16))+"; ad columns and Segment: full September (unchanged). "+
  (OPEN_N?fmtD(DATA.days.end_date)+" is still incomplete in the source: "+OPEN_N.toLocaleString("en-GB")+" eBay orders dated that day are not Completed yet ("+Object.entries(OPEN).map(([k,v])=>v+" "+k).join(", ")+") and are not counted, so its figures will grow as they complete. ":"");
const NL=r=>'<span class="na" title="Listing created '+fmtD(r.created)+' (after Sep 2025); no LY data exists">Not live in Sep 2025</span>';
const MPS=[...new Set(ROWS.map(r=>r.mp))].sort((a,b)=>(a==="UK"?-1:b==="UK"?1:a.localeCompare(b)));

const nf0=new Intl.NumberFormat("en-GB",{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const NA='<span class="na">N/A</span>',ND='<span class="na">No data</span>',NADV='<span class="na">Not advertised</span>';
const m2=v=>nf2.format(v),i0=v=>nf0.format(v);
const yoyV=(ly,ty)=>ly===0?null:(ty-ly)/ly*100;
function yoyHtml(ly,ty){const v=yoyV(ly,ty);if(v===null)return NA;return '<span class="'+(v>0?"pos":v<0?"neg":"")+'">'+(v>0?"+":"")+nf2.format(v)+"%</span>";}
const views=(p,lbl)=>p.v===null?ND:p.imNA?'<span title="'+lbl+' Views for the selected Sep days (impressions are not split by day)">'+i0(p.v)+"</span>":'<span title="'+lbl+" Impressions: "+(p.im===null?"no data":i0(p.im))+(p.im?" · CTR "+nf2.format(p.v/p.im*100)+"%":"")+'">'+i0(p.v)+"</span>";
const convV=p=>p.v===null||p.v===0?null:p.o/p.v*100;
const conv=p=>p.v===null?ND:p.v===0?NA:nf2.format(p.o/p.v*100)+"%";
const price=p=>p.u===0?NA:m2(p.pxq/p.u);
// Standard (COST_PER_SALE) and Advanced (ON_SITE) listed separately, never summed.
function ad(r,per,fn){
  const s=r.ads.S&&r.ads.S[per],a=r.ads.A&&r.ads.A[per];
  if(!s&&!a)return NADV;
  return [["Std","std","Standard",s],["Adv","adv","Advanced",a]].map(([lb,c,nm,x])=>'<span class="s"><b class="'+c+'" title="'+nm+'">'+lb+"</b>"+(x?fn(x):'<span class="na" title="Not advertised ('+nm+')">–</span>')+"</span>").join("");
}
const ra=a=>(a[2]===0?"N/A":nf2.format(a[3]/a[2]))+" / "+(a[3]===0?"N/A":nf2.format(a[2]/a[3]*100)+"%");
const segCls=s=>s.startsWith("A")?"ok":s.startsWith("C")||s.startsWith("D")?"bad":s.startsWith("Undetermined")?"warn":"grey";
function segPills(seg){return seg.map(s=>'<span class="pill '+segCls(s)+'" data-seg="'+esc(s)+'"'+(s.startsWith("Undetermined")?' title="TY Sales &lt; LY Sales with TY &gt; 0. “recent sales improving” (B) and “TY Sales ≈ 0” (D) are not defined in Ebay.xlsx"':"")+">"+esc(s)+"</span>").join("");}
// left accent bar: worst-signal segment of the row
const barCls=seg=>seg.some(s=>s.startsWith("C")||s.startsWith("D"))?"sBad":seg.some(s=>s.startsWith("Undetermined"))?"sU":seg.some(s=>s.startsWith("A"))?"sA":"sN";
// every SKU shown in full, one per line; long lists scroll inside the cell (max ~6 lines)

const xe=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=v=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for(const [name,txt] of files){
    const nb=enc.encode(name),db=enc.encode(txt),c=crc32(db);
    const h=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(h,nb,db);
    cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=h.length+nb.length+db.length;
  }
  const cs=cen.reduce((a,b)=>a+b.length,0);
  return new Blob([...parts,...cen,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)])],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const colL=i=>(i>=26?String.fromCharCode(64+Math.floor(i/26)):"")+String.fromCharCode(65+i%26);
function exportRows(){
  const rs=pCurrent(),dT=$("pTo").value,out=[PCOLS];
  out[0]=PCOLS.map((c,i)=>PRNG_K[PKEYS[i]]?c+" ("+PRNG_K[PKEYS[i]]()+")":c);
  rs.forEach((p,i)=>{const b=bosV(p,dT),e=ebV(p,dT),ly=skuPrice(p,0),ty=skuPrice(p,1);
    out.push([i===0||!sameId(p,rs[i-1])?p.r.id:null,p.sku||null,catOf(p)||null,ly===null?null:+ly.toFixed(4),ty===null?null:+ty.toFixed(4),lpV(p),b===null?null:+b,e===null?null:+e,sepOrders(p,1)]);});
  return out;
}
// sheets = [[name, rows], ...]; rows[0] = header; null = empty cell (blank, never 0)
function xlsxBook(sheets){
  const NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"',RNS='xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const sheetXml=rows=>{
    const w=rows[0].map((_,c)=>Math.min(60,Math.max(...rows.map(r=>r[c]===null||r[c]===undefined?0:String(r[c]).length))+2));
    const cell=(v,r,c)=>{const ref=colL(c)+(r+1);if(v===null||v===undefined)return "";
      if(typeof v==="number")return '<c r="'+ref+'" s="2"><v>'+v+"</v></c>";
      return '<c r="'+ref+'" t="inlineStr" s="'+(r===0?1:3)+'"><is><t xml:space="preserve">'+xe(v)+"</t></is></c>";};
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet '+NS+'><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'+
      w.map((x,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+x+'" customWidth="1"/>').join("")+"</cols><sheetData>"+
      rows.map((r,i)=>'<row r="'+(i+1)+'">'+r.map((v,c)=>cell(v,i,c)).join("")+"</row>").join("")+"</sheetData></worksheet>";};
  const n=sheets.map((_,i)=>i+1);
  return zip([
    ["[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+n.map(k=>'<Override PartName="/xl/worksheets/sheet'+k+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
    ["_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ["xl/workbook.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook '+NS+" "+RNS+"><sheets>"+sheets.map((s,i)=>'<sheet name="'+xe(s[0])+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+"</sheets></workbook>"],
    ["xl/_rels/workbook.xml.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+n.map(k=>'<Relationship Id="rId'+k+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+k+'.xml"/>').join("")+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ...sheets.map((s,i)=>["xl/worksheets/sheet"+(i+1)+".xml",sheetXml(s[1])]),
    ["xl/styles.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet '+NS+'><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="2" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>']]);
}
const xlsx=rows=>xlsxBook([["Price & SKU Sales Analysis",rows]]);

// ===================== Final Output Sales: Sep date range + download =====================
// ---- Sep date range (September Comparison Table): Sales / Orders / Views / Conversion for the selected days ----
// TY = the selected days of Sep 2026; LY = the SAME calendar days of Sep 2025 (03_SQL/extract_daily.py splits the monthly
// extract by order_date / traffic date and proves the days add up to it). Ad columns and Segment stay full September.
// 1–30 Sep = the full-month table exactly as extracted (the extracted monthly values are restored, not re-summed).
// day index i = days since 1 Sep + 1 (1–30 = Sep, 31.. = Oct), the same index in 2025 (LY) and 2026 (TY)
const DAYS=DATA.days.rows,SEP_MIN="2026-09-01",SEP_MAX="2026-09-30",END=DATA.days.end_date,LAST=DATA.days.last_day;
const D0=Date.UTC(2026,8,1),idx=d=>Math.round((Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))-D0)/864e5)+1;
const TRF_LAST=idx(DATA.days.traffic_end);
const r4=x=>Math.round(x*1e4)/1e4;
let rng=[1,30];                       // last valid range (days of September); an invalid selection never replaces it
const fullMonth=()=>rng[0]===1&&rng[1]===30;
const dm=i=>i<=30?[i,"Sep"]:[i-30,"Oct"];
const dayTxt=(a,b,y)=>{const [x,m]=dm(a),[z,n]=dm(b);return (a===b?x+" "+m:m===n?x+"–"+z+" "+m:x+" "+m+"–"+z+" "+n)+" "+y;};
const rangeTxt=()=>dayTxt(rng[0],rng[1],2026)+" vs "+dayTxt(rng[0],rng[1],2025);
function applyDays(){
  const [a,b]=rng,full=fullMonth();
  for(const r of ROWS){
    if(!r.LY0){r.LY0=r.LY;r.TY0=r.TY;}
    if(full){r.LY=r.LY0;r.TY=r.TY0;continue;}
    // DAYS[key] = [LY views by day (0 = no traffic row), TY views by day, LY [[day,sales,orders]], TY [[day,sales,orders]]]
    const x=DAYS[r.id+"|"+r.mp]||[0,0,[],[]];
    const per=(vv,ss,base,noTrf)=>{let s=0,o=0,v=0;for(const [d,ds,dO] of ss)if(d>=a&&d<=b){s+=ds;o+=dO;}
      if(vv)for(let d=a;d<=b;d++)v+=vv[d-1];
      // Views: inside September keep the monthly "no traffic row" rule; once Oct days are included, null only without any traffic row;
      // a TY range that starts after the latest traffic date has no Views in the source at all -> null (No data), never 0
      return Object.assign({},base,{s:r4(s),o,v:noTrf||(b<=30?base.v===null:!vv)?null:v,imNA:true});};
    r.LY=per(x[0],x[2],r.LY0,false);r.TY=per(x[1],x[3],r.TY0,a>TRF_LAST);
  }
  rangeLbl=full?null:k=>k==="yoy"?rangeTxt():dayTxt(a,b,k[0]==="l"?2025:2026);
  $("sub").textContent="September -Comparision · LY = "+dayTxt(a,b,2025)+" · TY = "+dayTxt(a,b,2026)+(full?"":" (selected date range; ad columns and Segment: full September)")+" · Generated "+DATA.generated_at;
}
const isSep=d=>/^2026-[0-9]{2}-[0-9]{2}$/.test(d)&&d>=SEP_MIN&&d<=END;
function onRange(){
  const f=$("sdFrom").value,t=$("sdTo").value;
  const err=!f||!t?"Select both Date From and Date To.":!isSep(f)||!isSep(t)?"Dates must be within 1 Sep 2026 – "+fmtD(END)+".":f>t?"Date From must be on or before Date To.":"";
  $("sdFrom").classList.toggle("bad",!!err&&(!f||!isSep(f)||f>t));$("sdTo").classList.toggle("bad",!!err&&(!t||!isSep(t)||f>t));
  $("fDl").disabled=!!err;
  if(err){$("rMsg").className="rmsg err";$("rMsg").textContent=err+" The table still shows "+rangeTxt()+".";return;}
  rng=[idx(f),idx(t)];applyDays();rMsg();go(0);
}
function rMsg(){$("rMsg").className="rmsg";$("rMsg").textContent=(fullMonth()?"Full month: 1–30 Sep 2026 vs 1–30 Sep 2025":"Showing "+rangeTxt()+(rng[1]>30?" · includes October data ("+dayTxt(Math.max(rng[0],31),rng[1],2026)+" vs "+dayTxt(Math.max(rng[0],31),rng[1],2025)+")":"")+" · ad columns and Segment: full September")+
  (rng[1]>TRF_LAST?" · Views: traffic data only up to "+fmtD(DATA.days.traffic_end):"")+" · data up to "+fmtD(END)+openTxt();}
const baseRender=render;
render=function(){baseRender();
  if(!fullMonth())$("count").innerHTML+=' · <b class="rng">Sales, Orders, Views, Conversion: '+rangeTxt()+"</b>";};
// default range (business decision 2026-10-07): 1 Sep 2026 -> latest data date (END)
$("sdFrom").max=$("sdTo").max=END;$("sdFrom").value=SEP_MIN;$("sdTo").value=END;
rng=[1,LAST];applyDays();rMsg();go(0);
// ---- Price & SKU tab: its own sales Date From / Date To (same rules), default 1 Sep -> latest data date ----
const octTxt=(a,b)=>b>30?" · includes October data ("+dayTxt(Math.max(a,31),b,2026)+" vs "+dayTxt(Math.max(a,31),b,2025)+")":"";
prTxt=()=>dayTxt(prng[0],prng[1],2026)+" vs "+dayTxt(prng[0],prng[1],2025);
PRNG_K.lyp=()=>dayTxt(prng[0],prng[1],2025);PRNG_K.typ=PRNG_K.tyo=()=>dayTxt(prng[0],prng[1],2026);
function psMsg(){$("psMsg").className="rmsg";$("psMsg").textContent="Showing "+prTxt()+octTxt(prng[0],prng[1])+" · data up to "+fmtD(END)+openTxt();}
function onPRange(){
  const f=$("psFrom").value,t=$("psTo").value;
  const err=!f||!t?"Select both Date From and Date To.":!isSep(f)||!isSep(t)?"Dates must be within 1 Sep 2026 – "+fmtD(END)+".":f>t?"Date From must be on or before Date To.":"";
  $("psFrom").classList.toggle("bad",!!err&&(!f||!isSep(f)||f>t));$("psTo").classList.toggle("bad",!!err&&(!t||!isSep(t)||f>t));
  $("pDl").disabled=!!err;
  if(err){$("psMsg").className="rmsg err";$("psMsg").textContent=err+" The table still shows "+prTxt()+".";return;}
  prng=[idx(f),idx(t)];psMsg();pGo(0);
}
$("psFrom").max=$("psTo").max=END;$("psFrom").value=SEP_MIN;$("psTo").value=END;prng=[1,LAST];psMsg();pDirty=true;

$("sdFrom").addEventListener("change",onRange);$("sdTo").addEventListener("change",onRange);
// Excel of the filtered Final Output Sales table, for the selected date range (range columns are labelled with their dates)
const r2=v=>v===null||v===undefined?null:Math.round(v*100)/100;
function mainExport(){
  const H=["eBay ID","PH","Category","Account","Marketplace","SKU","SKU source","LY Sales","TY Sales","YoY %","LY Ad Sales (Std)","LY Ad Sales (Adv)","TY Ad Sales (Std)","TY Ad Sales (Adv)",
    "LY Views","TY Views","LY Orders","TY Orders","LY Conversion %","TY Conversion %","Ad Impressions (Std)","Ad Impressions (Adv)","Ad Clicks (Std)","Ad Clicks (Adv)",
    "Ad Spend (Std)","Ad Spend (Adv)","Ad Sales (Std)","Ad Sales (Adv)","ROAS (Std)","ROAS (Adv)","ACOS % (Std)","ACOS % (Adv)","Segment"];
  const NLV="Not live in Sep 2025",out=[H];
  const adv=(r,S,per,i)=>{const x=r.ads[S]&&r.ads[S][per];return x?x[i]:null;};
  const cv=p=>p.v===null?null:p.v===0?"N/A":r2(p.o/p.v*100);
  for(const r of current()){
    const yoy=yoyV(r.LY.s,r.TY.s);
    const ro=S=>{const x=r.ads[S]&&r.ads[S].TY;return !x?null:x[2]===0?"N/A":r2(x[3]/x[2]);},ac=S=>{const x=r.ads[S]&&r.ads[S].TY;return !x?null:x[3]===0?"N/A":r2(x[2]/x[3]*100);};
    out.push([r.id,r.ph.length?r.ph.join(", "):"Unassigned",DATA.rows[r.i][12]||null,r.acct,r.mp,(r.skus.length?r.skus:r.lsku).join(", ")||null,r.skus.length?"order":r.lsku.length?"listing":null,
      r2(r.LY.s),r2(r.TY.s),yoy===null?"N/A":r2(yoy),
      r.nl?NLV:r2(adv(r,"S","LY",3)),r.nl?NLV:r2(adv(r,"A","LY",3)),r2(adv(r,"S","TY",3)),r2(adv(r,"A","TY",3)),
      r.nl?NLV:r.LY.v,r.TY.v,r.LY.o,r.TY.o,r.nl?NLV:cv(r.LY),cv(r.TY),
      adv(r,"S","TY",0),adv(r,"A","TY",0),adv(r,"S","TY",1),adv(r,"A","TY",1),r2(adv(r,"S","TY",2)),r2(adv(r,"A","TY",2)),r2(adv(r,"S","TY",3)),r2(adv(r,"A","TY",3)),
      ro("S"),ro("A"),ac("S"),ac("A"),r.seg.join("; ")]);
  }
  const [a,b]=rng;
  out[0]=out[0].map(h=>/^LY (Sales|Views|Orders|Conversion %)$/.test(h)?h+" ("+dayTxt(a,b,2025)+")":/^TY (Sales|Views|Orders|Conversion %)$/.test(h)?h+" ("+dayTxt(a,b,2026)+")":h==="YoY %"?h+" ("+rangeTxt()+")":h);
  return out;
}
$("fDl").onclick=()=>{
  if($("fDl").disabled)return;
  const ph=$("fPh").value,iso=i=>new Date(D0+(i-1)*864e5).toISOString().slice(0,10);
  saveBlob(xlsxBook([["Final Output Sales",mainExport()]]),"Final_Output_Sales_"+(ph===""?"All_PHs":ph===NOPH?"Unassigned":ph.replace(/[^A-Za-z0-9_-]+/g,"_"))+"_"+iso(rng[0])+"_to_"+iso(rng[1])+".xlsx");
};
